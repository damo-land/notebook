# XcodeGen spec for the iOS companion app. The .xcodeproj is generated from
# this file and not committed: run `xcodegen` in ios/ after pulling.

name: Stash
options:
  bundleIdPrefix: land.damo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 23Q8MBM5MM
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  StashCore:
    path: StashCore
targets:
  Stash:
    type: application
    platform: iOS
    sources:
      - path: Stash
        excludes: [Info.plist, Stash.entitlements]
      - path: Shared
    entitlements:
      path: Stash/Stash.entitlements   # generated from these properties
      properties:
        com.apple.security.application-groups: [group.land.damo.stash]
    dependencies:
      - package: StashCore
      - target: StashWidget
    settings:
      base:
        INFOPLIST_FILE: Stash/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: land.damo.stash.ios
        PRODUCT_NAME: Stash
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: stash
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
  # Home-screen widget (small / medium / large). Reads only the task
  # snapshot the app writes into the shared App Group container; it never
  # touches the iCloud vault itself.
  StashWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: StashWidget
        excludes: [Info.plist, StashWidget.entitlements]
      - path: Shared
    entitlements:
      path: StashWidget/StashWidget.entitlements   # generated from these properties
      properties:
        com.apple.security.application-groups: [group.land.damo.stash]
    dependencies:
      - package: StashCore
    settings:
      base:
        INFOPLIST_FILE: StashWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: land.damo.stash.ios.widget
        PRODUCT_NAME: StashWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: stash
        SKIP_INSTALL: YES
schemes:
  Stash:
    build:
      targets:
        Stash: all
    run:
      config: Debug
    archive:
      config: Release
