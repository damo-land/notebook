[package]
name = "stash"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is required by `"macOSPrivateApi": true` in
# tauri.conf.json — the build script refuses to compile without it. It is what
# makes the webview's own background transparent, and therefore what makes the
# vibrancy material behind it visible at all.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
# NSPanel support for the overlay window (macOS-only crate; this app targets macOS).
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
# SQLite index; `bundled` compiles sqlite in (includes FTS5).
rusqlite = { version = "0.37", features = ["bundled"] }
# Vault dir file watcher.
notify = "8"
# macOS notifications for due alerts (fired from Rust: the scheduler must work
# while the overlay is hidden and the webview idle).
tauri-plugin-notification = "2"
# Real macOS NSVisualEffectView material behind the overlay webview
# (src-tauri/src/lib.rs, setup): the Spotlight-style blur.
window-vibrancy = "0.8.0"
# Move deleted notes to the macOS Trash (recoverable in Finder) instead of
# unlinking them (T4 delete_note).
trash = "5"

